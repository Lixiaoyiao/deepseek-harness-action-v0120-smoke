# Generated by create-deepseek-harness-action.
name: DSH commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dsh-command-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  command:
    if: >-
      github.event.sender.id != 41898282 &&
      contains(github.event.comment.body || github.event.review.body, '@dsh')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - id: dsh
        uses: Lixiaoyiao/deepseek-harness-action@c6456ed498cbbff2499fc5f586922a1d544a4ced
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          dsh-version: 0.2.1-rc.2
          permission-profile: standard
          isolation: docker
          # Enable explicitly to accept clear requests such as
          # "@dsh Please fix this bug and open a PR" through the validated write path.
          natural-language-write: "true"
          allow-write: "true"
          run-tests: "true"
          validation-integrity: strict
          # REQUIRED: Replace this fail-closed placeholder with your repository's
          # own credential-free validation argv. No package manager is assumed.
          test-commands: "[[\"node\",\"test.mjs\"]]"
          # Replace this digest-pinned image too if validation needs another toolchain.
          container-image: docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
      - name: Record existing redacted fixture audit outputs
        if: always()
        env:
          FIXTURE_RESULT_JSON: ${{ steps.dsh.outputs.result-json }}
        run: |
          node <<'NODE'
          const raw = process.env.FIXTURE_RESULT_JSON;
          if (!raw) throw new Error('Expected the existing result-json Action output');
          const result = JSON.parse(raw);
          const audit = Object.fromEntries(['schemaVersion', 'status', 'conclusion', 'operation', 'policy', 'permissions', 'toolPolicy', 'authority', 'validation', 'write', 'publication', 'githubRequests', 'loop', 'error'].filter(key => result[key] !== undefined).map(key => [key, result[key]]));
          console.log('FIXTURE_RESULT_JSON=' + JSON.stringify(audit));
          NODE
